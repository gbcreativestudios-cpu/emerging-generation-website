backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

publish_mode: editorial_workflow

locale: "en"

collections:
  # ------------------------------------------------------------
  # Site-wide settings: logo, brand colors, footer/contact info
  # ------------------------------------------------------------
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "content/settings.json"
        fields:
          - { label: "Organization Name", name: "org_name", widget: "string" }
          - { label: "Short Name (e.g. logo fallback initials)", name: "org_short", widget: "string" }
          - { label: "Tagline (under name)", name: "org_tagline", widget: "string" }
          - { label: "Header Logo (color)", name: "logo", widget: "image" }
          - { label: "Header Logo Height (px)", name: "logo_height", widget: "number", value_type: "int", default: 64, hint: "Controls the size of the logo in the top navigation bar." }
          - { label: "Favicon (shows in browser tabs)", name: "favicon", widget: "image" }
          - { label: "Footer Logo (white)", name: "logo_white", widget: "image" }
          - { label: "Footer Logo Height (px)", name: "footer_logo_height", widget: "number", value_type: "int", default: 64, hint: "Controls the size of the logo at the top of the footer." }
          - label: "Brand Colors"
            name: "colors"
            widget: "object"
            fields:
              - { label: "Primary (dark green)", name: "primary", widget: "color" }
              - { label: "Secondary (mid green)", name: "secondary", widget: "color" }
              - { label: "Accent (orange, CTA buttons)", name: "accent", widget: "color" }
              - { label: "Accent Yellow", name: "accent_yellow", widget: "color" }
          - { label: "Nav 'Join' Button Label", name: "nav_cta_label", widget: "string" }
          - { label: "Footer Blurb", name: "footer_blurb", widget: "text" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Contact Location", name: "contact_location", widget: "string" }
          - { label: "Footer Note (bottom right)", name: "footer_note", widget: "string" }
          - label: "Social Links (footer icons)"
            name: "social_links"
            widget: "list"
            hint: "Toggle a platform off to hide its icon in the footer without deleting it."
            fields:
              - { label: "Platform", name: "platform", widget: "select", options: [
                  { label: "Email", value: "mail" },
                  { label: "Instagram", value: "instagram" },
                  { label: "LinkedIn", value: "linkedin" },
                  { label: "Facebook", value: "facebook" },
                  { label: "X / Twitter", value: "twitter" },
                  { label: "TikTok", value: "tiktok" },
                  { label: "YouTube", value: "youtube" }
                ] }
              - { label: "Label (for accessibility)", name: "label", widget: "string" }
              - { label: "URL (use mailto: for email)", name: "url", widget: "string" }
              - { label: "Show in footer?", name: "enabled", widget: "boolean", default: true }
          - { label: "Form Success Heading", name: "form_success_heading", widget: "string", hint: "Shown after any of the 4 signup forms is submitted." }
          - { label: "Form Success Message", name: "form_success_message", widget: "text" }

  # ------------------------------------------------------------
  # Home page content
  # ------------------------------------------------------------
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/home.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline (typed out on load)", name: "headline_start", widget: "string", hint: "The plain white part, e.g. The next generation isn't waiting. It's" }
              - { label: "Headline Highlighted Ending (green)", name: "headline_highlight", widget: "string", hint: "e.g. emerging." }
              - { label: "Words That Rotate After The Ending", name: "rotating_words", widget: "list", required: false, hint: "After the green ending types out, the headline erases it and types each of these in turn, then loops back to the first. Include the full stop, e.g. connecting." }
              - { label: "Subline (leave blank to hide)", name: "subline", widget: "string", required: false }
              - { label: "Button Label", name: "cta_label", widget: "string" }
              - { label: "Group Photo (transparent PNG works best)", name: "group_image", widget: "image", hint: "Wide cutout of the group. On phones the sides are cropped." }
              - { label: "Scrolling Ticker Words", name: "ticker_words", widget: "list", hint: "Each word scrolls across the green band, separated by a star." }
          - label: "Who We Are (green section)"
            name: "who_we_are"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Link Label", name: "link_label", widget: "string" }
          - label: "Navigate / Grow / Give Back Cards"
            name: "pillars"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "select", options: ["compass", "sparkles", "heart"] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Speakers Preview Section"
            name: "speakers_preview"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Link Label", name: "link_label", widget: "string" }
          - label: "Why Newcomers Excel (Benefits)"
            name: "benefits"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Benefit Cards"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Number (e.g. 01)", name: "number", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Get Involved Cards"
            name: "get_involved"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Cards"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["users", "compass", "heart", "briefcase"] }
                  - { label: "Accent Color", name: "color", widget: "select", options: ["accent", "secondary", "yellow", "primary"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Button Label", name: "button_label", widget: "string" }
                  - { label: "Form Title (which form this button opens)", name: "action", widget: "select", options: ["Join Community", "Become a Mentor", "Volunteer", "Partner"] }

  # ------------------------------------------------------------
  # About page content
  # ------------------------------------------------------------
  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page"
        file: "content/about.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Who We Are"
            name: "who_we_are"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph_1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph_2", widget: "text" }
          - label: "Our Vision"
            name: "vision"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
          - label: "Our Mission"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
          - label: "Our Values"
            name: "values"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Value Cards (exactly 6 recommended)"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["shield", "sparkles", "compass", "award", "users", "heart"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Our Promise"
            name: "promise"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Who We Serve"
            name: "who_we_serve"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
          - label: "Why The Emerging Generation"
            name: "why_us"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Founder Story"
            name: "founder"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Show Story Section?", name: "show_story", widget: "boolean", default: true }
              - { label: "Story", name: "story", widget: "text", hint: "Paste your bio here. Leave a blank line between paragraphs to break them apart — or leave it as one block if you prefer." }
              - { label: "Show Pull Quote?", name: "show_quote", widget: "boolean", default: true }
              - { label: "Pull Quote", name: "quote", widget: "text" }
              - { label: "Show Closing Paragraph?", name: "show_closing", widget: "boolean", default: true }
              - { label: "Closing Paragraph", name: "closing_paragraph", widget: "text" }
          - label: "Get Involved Section Header"
            name: "get_involved"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

  # ------------------------------------------------------------
  # Gallery — each collection (e.g. "Unshaken 2026 Media") is a thumbnail on
  # the Gallery page. Inside it: a Photos thumbnail and/or a Videos thumbnail.
  # ------------------------------------------------------------
  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery Page"
        file: "content/gallery.json"
        fields:
          - label: "Collections"
            name: "collections"
            widget: "list"
            required: false
            add_to_top: true
            summary: "{{fields.title}}"
            hint: "Each collection shows as a thumbnail on the Gallery page, e.g. 'Unshaken 2026 Media'. Opening it shows its photos, then its videos. You can add photos, videos, or both. New collections go to the top."
            fields:
              - { label: "Collection Title", name: "title", widget: "string", hint: "e.g. Unshaken 2026 Media" }
              - { label: "Collection Thumbnail (leave blank to use the first photo)", name: "cover", widget: "image", required: false }
              - label: "Photos"
                name: "photo_sections"
                widget: "list"
                required: false
                summary: "{{fields.heading}}"
                hint: "Leave empty if this collection has no photos. Each category has an optional heading (e.g. 'Speakers from Unshaken 2026') and its photos. One category with no heading is fine."
                fields:
                  - { label: "Category Heading (optional)", name: "heading", widget: "string", required: false }
                  - { label: "Photos", name: "photos", widget: "image", allow_multiple: true, required: false, hint: "Click 'Choose images' and select as many as you like at once. No captions needed." }
                  - { label: "Show the last photo you added first?", name: "newest_first", widget: "boolean", default: false, required: false }
              - label: "Videos"
                name: "videos"
                widget: "list"
                required: false
                add_to_top: true
                summary: "{{fields.title}} {{fields.video_url}}"
                hint: "Leave empty if this collection has no videos. Paste a link from YouTube, Vimeo, Instagram, TikTok, Facebook or anywhere else. YouTube/Vimeo thumbnails are automatic; for the others upload a thumbnail. Links that can't play inside the page open in a new tab."
                fields:
                  - { label: "Video Title (optional)", name: "title", widget: "string", required: false }
                  - { label: "Video Link (any platform)", name: "video_url", widget: "string", required: false }
                  - { label: "Or upload a video file (short clips, .mp4)", name: "video_file", widget: "file", required: false }
                  - { label: "Thumbnail (optional — overrides the automatic one)", name: "thumbnail", widget: "image", required: false }
                  - { label: "Thumbnail Shape", name: "shape", widget: "select", default: "auto", required: false, options: [{ label: "Automatic", value: "auto" }, { label: "Wide (16:9)", value: "landscape" }, { label: "Square", value: "square" }, { label: "Tall (9:16, for reels/TikToks)", value: "vertical" }] }

  # ------------------------------------------------------------
  # Speakers — one file per speaker. Click "New Speaker" to add
  # one, or open an existing speaker and use "Duplicate" to copy
  # one as a starting point for a new profile.
  # ------------------------------------------------------------
  - name: "speakers"
    label: "Speakers"
    folder: "content/speakers"
    create: true
    duplicate: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position / Title", name: "position", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Experience / Background", name: "experience", widget: "string", required: false }
      - { label: "Show Speaking Topics section?", name: "show_topics", widget: "boolean", default: true, required: false, hint: "Turn off to hide this section on their profile entirely, e.g. if left blank." }
      - { label: "Speaking Topics", name: "topics", widget: "list", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1, required: false }
      - { label: "Show on site?", name: "visible", widget: "boolean", default: true, required: false, hint: "Turn off to hide this speaker without deleting their profile." }
      - { label: "Biography", name: "body", widget: "markdown", required: false }
